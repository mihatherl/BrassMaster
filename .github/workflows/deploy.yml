# Builds the app and publishes it to GitHub Pages at brassmaster.net.
#
# VITE_BASE=/ because a custom domain serves from the root (see vite.config.ts).
# The domain itself is site/CNAME plus the Pages custom-domain setting.
name: Deploy

on:
  push:
    branches: [main]
  # Lets a deploy be triggered by hand from the Actions tab.
  workflow_dispatch:

# One deployment at a time; a newer push supersedes a queued one but never
# interrupts a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deploying something that does not typecheck or pass its tests would be
      # worse than not deploying at all.
      - run: npm test

      # The gate run by hand before every push is tests, build *and* lint, and
      # until now this workflow ran two of the three — so the check that could
      # actually be forgotten was the one nothing enforced. Cheap, and it costs
      # nothing to keep the two gates saying the same thing.
      - run: npm run lint

      # The paid build is the one nothing else ever builds, and an unbuilt path
      # rots — tools/ already has once, and VITE_GATED taught the same lesson
      # before it. Built only to prove it still compiles; its dist is thrown
      # away by the web build that follows.
      #
      # Deliberately before the real build: both write to dist/, and the last
      # one to run is the one that gets published. Reversing the order would
      # quietly deploy the paid app to the free site.
      - run: npm run build:app

      # The web build now clears dist/, writes the app to dist/app/ with a base
      # of /app/, and copies the landing page over the root — all inside the
      # script, so nothing here needs to know the layout. The clear is what
      # keeps the hazard above from getting worse: the paid build's dist/ is
      # removed before the site is assembled, so it cannot be published.
      - run: npm run build:web

      # The free build must not *contain* the paid features, which is the whole
      # point of drawing the line at build time. Nothing on screen would show
      # it if this broke, and it has broken twice already — see the script.
      - run: npm run check:web

      # And it must not carry the tailnet copy's name. CI never sets
      # VITE_CHANNEL, so this is the release direction of the check: it proves
      # that what is about to be published is called "Brass Master" and not
      # "Brass Master — Dev". The dev direction is proved by whoever builds the
      # tailnet copy, which is the only thing that sets the variable.
      - run: npm run check:channel

      # Creates the Pages site on first run, so a fresh repository needs no
      # manual "enable Pages" step — only the custom domain is set by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
